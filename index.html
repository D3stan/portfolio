<!doctype html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />

	<title>Loading...</title>
	
	<!-- Theme detection script - must run before page renders to prevent flash -->
	<script>
		(function() {
			try {
				// Detect system theme preference
				const getSystemTheme = () => {
					if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
						return 'dark';
					}
					return 'light';
				};
				
				// Get saved theme or fallback to system preference
				const savedTheme = localStorage.getItem('theme');
				const theme = savedTheme || getSystemTheme();
				
				// Apply theme attribute immediately
				if (theme === 'dark') {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			} catch (e) {
				// localStorage might not be available in private browsing mode
				// Fallback to system theme preference
				if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			}
		})();
	</script>
</head>

<body>
	<div id="root"></div>
	<script type="module" src="/src/main.jsx"></script>
</body>

</html>
